[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maquina"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["yt-dlp", "faster-whisper"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["maquina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
